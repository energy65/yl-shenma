name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  construction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 改用官方 setup-android，稳定可靠
      - name: Setup Android SDK
        uses: actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0 platforms;android-34

      - name: Download and install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O gradle.zip
          unzip -q gradle.zip
          rm gradle.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Release APK
        run: ./gradlew assembleRelease

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > shenma.jks

      - name: Zipalign and sign the APK
        run: |
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | tail -1)
          echo "Unsigned APK: $UNSIGNED"
          # 直接固定build-tools版本，不再ls遍历，避免空变量
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          echo "Android Build Tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" shenma-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks shenma.jks \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out shenma-release.apk shenma-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose shenma-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ShenmaAPP-v3.7.11-release
          path: shenma-release.apk
