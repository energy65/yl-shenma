name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  construction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Setup Android SDK，移除不支持的 accept-licenses
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34

      - name: Download and install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O gradle.zip
          unzip -q gradle.zip
          rm gradle.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 解密JKS密钥到app目录
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/shenma.jks

      # 清理旧产物 + 构建Release签名包
      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: shenma.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew clean
          ./gradlew assembleRelease

      # 调试：打印所有apk文件路径
      - name: Find all generated APK
        run: find . -name "*.apk"

      # 上传APK，使用通配符自动匹配，不用写死文件名
      - name: Upload Signed APK
        uses: actions/upload-artifact@v6
        with:
          name: ShenmaAPP-v3.7.11-release
          path: |
            **/build/outputs/apk/release/*.apk
